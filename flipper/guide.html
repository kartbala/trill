<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Craft to Flipper, step by step</title>
<style>
  :root { --ink:#000; --paper:#fff; --dim:#444; --hot:#ff5a00; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--paper); color:var(--ink); }
  body { font:30px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif; padding:0 0 150px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
           padding:16px 28px; border-bottom:6px solid #000; }
  #progress { font-size:30px; font-weight:800; }
  #dots { display:flex; gap:8px; flex-wrap:wrap; }
  #dots i { width:22px; height:22px; border-radius:50%; border:4px solid #000; background:#fff; }
  #dots i.done { background:#000; }
  #dots i.now { background:var(--hot); border-color:var(--hot); }
  main { padding:20px 28px 0; max-width:1000px; }
  h1 { font-size:54px; line-height:1.1; margin:6px 0 16px; }
  #text p { margin:0 0 12px; }
  #text p.key { font-weight:800; font-size:34px; }
  #text p.warn { background:#000; color:#fff; padding:14px 20px; border-radius:12px; font-weight:700; }
  #text ol, #text ul { margin:0 0 12px; padding-left:40px; }
  #text li { margin-bottom:8px; }
  .scroll { overflow-x:auto; margin:18px 0 8px; }
  #scene svg { display:block; min-width:900px; width:900px; height:auto; }
  #extra { margin-top:14px; }
  button { font:inherit; font-weight:800; cursor:pointer; border:5px solid #000; border-radius:16px;
           background:#fff; color:#000; padding:14px 24px; }
  button:focus-visible { outline:6px solid var(--hot); outline-offset:3px; }
  .toggles { display:flex; gap:12px; flex-wrap:wrap; }
  #speak, #motion { font-size:26px; padding:10px 18px; }
  #speak.on, #motion.on { background:#000; color:#fff; }
  .sound { display:block; width:100%; max-width:760px; text-align:left; margin:0 0 14px; font-size:30px; }
  .sound small { display:block; font-weight:400; font-size:26px; }
  .route { display:block; width:100%; max-width:760px; text-align:left; margin:0 0 14px; font-size:30px; }
  .route small { display:block; font-weight:400; font-size:26px; }
  .route.on { background:#000; color:#fff; }
  nav { position:fixed; left:0; right:0; bottom:0; display:flex; gap:16px; padding:16px 28px;
        background:#fff; border-top:6px solid #000; }
  nav button { flex:1; font-size:38px; padding:20px 10px; }
  #next { background:#000; color:#fff; }
  nav button:disabled { opacity:.25; cursor:default; }

  /* scene animation */
  .pulse { animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.15; } }
  .bob { animation:bob 1s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(14px); } }
  .unplug { animation:unplug 3.2s ease-in-out infinite; }
  @keyframes unplug { 0%,25% { transform:translateX(0); } 60%,100% { transform:translateX(120px); } }
  .slidein { animation:slidein 3.4s ease-in-out infinite; }
  @keyframes slidein { 0%,18% { transform:translateX(150px); } 55%,100% { transform:translateX(0); } }
  .tap { animation:tap 1.6s ease-in-out infinite; }
  @keyframes tap { 0%,100% { transform:translateY(-46px); } 40%,60% { transform:translateY(0); } }
  .note { animation:note 1.6s ease-out infinite; }
  @keyframes note { 0%,40% { opacity:0; transform:translateY(0); } 50% { opacity:1; } 100% { opacity:0; transform:translateY(-90px); } }
  /* four jumper wires, one after another, on an 8 s loop */
  .jw { animation:jw1 8s ease-in-out infinite; }
  .jw.n2 { animation-name:jw2; } .jw.n3 { animation-name:jw3; } .jw.n4 { animation-name:jw4; }
  @keyframes jw1 { 0%,6%  { transform:translateX(160px); } 16%,100% { transform:translateX(0); } }
  @keyframes jw2 { 0%,24% { transform:translateX(160px); } 34%,100% { transform:translateX(0); } }
  @keyframes jw3 { 0%,42% { transform:translateX(160px); } 52%,100% { transform:translateX(0); } }
  @keyframes jw4 { 0%,60% { transform:translateX(160px); } 70%,100% { transform:translateX(0); } }
  /* one solder joint, on a 7 s loop */
  .iron { animation:iron 7s ease-in-out infinite; }
  @keyframes iron { 0%,6% { transform:translate(-150px,-150px); } 18%,74% { transform:translate(0,0); } 86%,100% { transform:translate(-150px,-150px); } }
  .solder { animation:solder 7s ease-in-out infinite; }
  @keyframes solder { 0%,30% { transform:translate(150px,-150px); } 40%,58% { transform:translate(0,0); } 68%,100% { transform:translate(150px,-150px); } }
  .cone { animation:cone 7s linear infinite; }
  @keyframes cone { 0%,44% { opacity:0; } 56%,96% { opacity:1; } 100% { opacity:0; } }
  /* limb wires draw themselves in, one after another */
  .limb { stroke-dasharray:400; animation:limb 8s ease-in-out infinite; }
  @keyframes limb { 0% { stroke-dashoffset:400; } 12%,100% { stroke-dashoffset:0; } }
  .wire { transition:transform .9s cubic-bezier(.3,.7,.3,1); }
  /* the plug end of a cable, cut off and pushed aside, on a 5 s loop */
  .cutoff { animation:cutoff 5s ease-in-out infinite; }
  @keyframes cutoff { 0%,35% { transform:translateX(0); } 65%,100% { transform:translateX(-64px); } }

  .still .pulse, .still .bob, .still .unplug, .still .slidein, .still .tap, .still .note,
  .still .jw, .still .iron, .still .solder, .still .cone, .still .limb, .still .cutoff { animation:none; }
  .still .cutoff { transform:translateX(-64px); }
  /* a finger sliding along the Bar, on a 4 s loop */
  .slide { animation:slide 4s ease-in-out infinite; }
  @keyframes slide { 0%,100% { transform:translateX(0); } 50% { transform:translateX(300px); } }
  .still .slide { animation:none; transform:translateX(150px); }
  .still .note { opacity:1; transform:translateY(-50px); }
  .still .limb { stroke-dasharray:none; }
  .still .wire { transition:none; }
</style>
</head>
<body>

<header>
  <div id="progress"></div>
  <div id="dots"></div>
  <div class="toggles">
    <button id="motion" type="button">Animation: on</button>
    <button id="speak" type="button">Read aloud: off</button>
  </div>
</header>

<main>
  <h1 id="title"></h1>
  <div id="text"></div>
  <div class="scroll"><div id="scene"></div></div>
  <div id="extra"></div>
</main>

<nav>
  <button id="back" type="button">&larr; Back</button>
  <button id="next" type="button">Next &rarr;</button>
</nav>

<script>
const params = new URLSearchParams(location.search);
// Animation is on unless switched off with the button. This page was asked for
// with animations, so the system "reduce motion" setting does not silence it.
let STILL = params.has('still');
try { if (localStorage.getItem('pinmap-motion') === 'off') STILL = true; } catch (e) {}

const COL = {
  red:    { fill:'#d40000', name:'RED' },
  black:  { fill:'#000000', name:'BLACK' },
  white:  { fill:'#ffffff', name:'WHITE' },
  yellow: { fill:'#ffd400', name:'YELLOW' },
  blue:   { fill:'#1e6bff', name:'BLUE' },
};
// Two ways to join the Craft to the Flipper:
//   'jumper' = solder the six-pin strip, then four socket-to-pin jumper wires
//   'cable'  = no jumper wires: cut the plug off one Trill cable and solder its four wires into the Craft
//   'bar'    = the two-minute home test: Trill Bar and its own cable, no soldering (?route=bar only)
// KB's Trill cables are red, black, blue, yellow (no white): blue = data (SDA), yellow = clock (SCL).
// On the jumper route the data wire is white. The clock wire is yellow on every route.
let ROUTE = 'jumper';
try { if (localStorage.getItem('guide-route') === 'cable') ROUTE = 'cable'; } catch (e) {}
if (['cable', 'jumper', 'bar'].includes(params.get('route'))) ROUTE = params.get('route');
const SCLC = () => 'yellow';
const SDAC = () => ROUTE === 'jumper' ? 'white' : 'blue';
const LIGHT = c => c === 'white' || c === 'yellow';   // needs a black outline on a white page
// hole index inside the Flipper's group of ten: 0 = pin 9 ... 9 = pin 18
const HOLE = { red:0, black:2, white:6, blue:6, yellow:7 };

/* ---------- the Craft, drawn from the photo: chip side up, round end left, flat end right ---------- */
const PADX = n => n <= 14 ? 650 - n * 31 : 216 + (n - 15) * 31;   // pads 0-14 top row, 15-29 bottom row
const PADY = n => n <= 14 ? 150 : 370;
const I2C = ['SCL', 'SDA', '+V', 'GND', 'EVT', 'RST'];
const I2CY = k => 183 + k * 31;
const I2CX = 705;

function craft(o) {
  o = o || {};
  let s = `<path d="M230 120 H730 Q740 120 740 130 V390 Q740 400 730 400 H230 A140 140 0 0 1 230 120 Z" fill="#111" stroke="#000" stroke-width="5"/>`;
  for (let n = 0; n < 30; n++) {
    s += `<circle cx="${PADX(n)}" cy="${PADY(n)}" r="11" fill="#d4af37"/><circle cx="${PADX(n)}" cy="${PADY(n)}" r="5" fill="#111"/>`;
  }
  for (let k = 0; k < 6; k++) {
    s += `<circle cx="${I2CX}" cy="${I2CY(k)}" r="11" fill="#d4af37"/><circle cx="${I2CX}" cy="${I2CY(k)}" r="5" fill="#111"/>`;
  }
  s += `<circle cx="150" cy="260" r="20" fill="#d4af37"/><circle cx="150" cy="260" r="11" fill="#fff"/>
        <path d="M440 222 L478 260 L440 298 L402 260 Z" fill="#2b2b2b" stroke="#777" stroke-width="3"/>`;
  if (o.labels !== false) {
    s += `<text x="255" y="252" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">TRILL</text>
          <text x="255" y="282" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">CRAFT</text>
          <text x="440" y="330" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">chip</text>
          ${o.noTop ? '' : `<text x="650" y="100" font-size="28" font-weight="800" text-anchor="middle">0</text>
          <text x="216" y="100" font-size="28" font-weight="800" text-anchor="middle">14</text>`}
          <text x="216" y="444" font-size="28" font-weight="800" text-anchor="middle">15</text>
          <text x="650" y="444" font-size="28" font-weight="800" text-anchor="middle">29</text>`;
  }
  if (o.i2cLabels) {
    for (let k = 0; k < 6; k++) {
      s += `<text x="674" y="${I2CY(k) + 8}" font-size="22" font-weight="800" fill="#fff" text-anchor="end">${I2C[k]}</text>`;
    }
  }
  return s;
}

// the six-pin right-angle strip, soldered on the flat end, long legs pointing right
function headerStrip() {
  let s = '';
  for (let k = 0; k < 6; k++) s += `<rect x="${I2CX - 4}" y="${I2CY(k) - 4}" width="130" height="8" fill="#b9b9b9" stroke="#000" stroke-width="1.5"/>`;
  s += `<rect x="746" y="${I2CY(0) - 15}" width="26" height="${31 * 5 + 30}" rx="3" fill="#222" stroke="#000" stroke-width="3"/>`;
  return s;
}

// a jumper wire's socket end, pushed onto pin k of the strip
function jumper(color, k, cls, num) {
  const c = COL[color].fill, y = I2CY(k);
  const ink = (color === 'white' || color === 'yellow') ? '#000' : '#fff';
  const outline = LIGHT(color) ? `<path d="M868 ${y} H1100" stroke="#000" stroke-width="16" fill="none"/>` : '';
  return `<g class="${cls || ''}">${outline}
    <path d="M868 ${y} H1100" stroke="${c}" stroke-width="10" fill="none"/>
    <rect x="786" y="${y - 13}" width="84" height="26" rx="4" fill="${c}" stroke="#000" stroke-width="4"/>
    ${num ? `<text x="828" y="${y + 8}" font-size="22" font-weight="800" fill="${ink}" text-anchor="middle">${num}</text>` : ''}
  </g>`;
}

// a cable wire soldered straight into hole k of the flat end (the no-jumper route)
function tail(color, k, cls, num) {
  const c = COL[color].fill, y = I2CY(k);
  const outline = LIGHT(color) ? `<path d="M${I2CX} ${y} H1100" stroke="#000" stroke-width="16" fill="none"/>` : '';
  return `<g class="${cls || ''}">${outline}
    <path d="M${I2CX} ${y} H1100" stroke="${c}" stroke-width="10" fill="none"/>
    <circle cx="${I2CX}" cy="${y}" r="10" fill="#e6e6e6" stroke="#000" stroke-width="3"/>
    ${num ? `<circle cx="800" cy="${y}" r="15" fill="#fff" stroke="#000" stroke-width="4"/>
             <text x="800" y="${y + 8}" font-size="22" font-weight="800" text-anchor="middle">${num}</text>` : ''}
  </g>`;
}

// the Craft's link to the Flipper, drawn for whichever route is chosen
function link(animated) {
  const cols = [SCLC(), SDAC(), 'red', 'black'];
  if (ROUTE === 'cable') return cols.map((c, k) => tail(c, k, animated ? 'jw n' + (k + 1) : '', animated ? k + 1 : '')).join('');
  return headerStrip() + cols.map((c, k) => jumper(c, k, animated ? 'jw n' + (k + 1) : '', animated ? String(k + 1) : '')).join('');
}

function scenePlan() {
  const rods = [0, 1, 2, 3, 4, 5, 6, 7].map(n =>
    `<path class="limb" style="animation-delay:${n * 0.5}s" d="M${PADX(n)} 150 V70" stroke="#c77b00" stroke-width="7" fill="none"/>
     <rect x="${PADX(n) - 8}" y="14" width="16" height="60" rx="6" fill="#d4af37" stroke="#000" stroke-width="3"/>`).join('');
  return `<svg viewBox="0 0 900 470" role="img" aria-label="The Craft, four wires going to the Flipper, and eight metal limbs.">
    ${rods}
    ${craft({ labels: false })}${link()}
    <text x="430" y="445" font-size="28" font-weight="800" text-anchor="middle">Craft</text>
    <text x="760" y="445" font-size="28" font-weight="800" text-anchor="middle">to the Flipper &rarr;</text>
    <text x="300" y="60" font-size="28" font-weight="800" text-anchor="middle">metal limbs</text>
  </svg>`;
}

function sceneHeader() {
  return `<svg viewBox="0 0 900 470" role="img" aria-label="The six-pin strip slides into the six holes on the flat end of the Craft.">
    ${craft({ i2cLabels: true })}
    <rect class="pulse" x="${I2CX - 18}" y="${I2CY(0) - 20}" width="36" height="${31 * 5 + 40}" rx="12" fill="none" stroke="#ff5a00" stroke-width="6"/>
    <g class="slidein">${headerStrip()}</g>
    <text x="800" y="120" font-size="26" font-weight="800" fill="#ff5a00" text-anchor="middle">pin strip</text>
    <text x="100" y="100" font-size="24" font-weight="800" text-anchor="middle">round end</text>
    <text x="780" y="444" font-size="24" font-weight="800" text-anchor="middle">flat end</text>
  </svg>`;
}

function sceneJoint(what) {
  what = what || 'leg';
  return `<svg viewBox="0 0 900 470" role="img" aria-label="Side view of one solder joint: iron on the ${what} and ring, then solder, then a shiny cone.">
    <rect x="80" y="300" width="740" height="46" fill="#123c2a" stroke="#000" stroke-width="4"/>
    <rect x="430" y="300" width="40" height="46" fill="#fff"/>
    <rect x="380" y="290" width="50" height="12" fill="#d4af37" stroke="#000" stroke-width="2"/>
    <rect x="470" y="290" width="50" height="12" fill="#d4af37" stroke="#000" stroke-width="2"/>
    <rect x="442" y="205" width="16" height="200" fill="#b9b9b9" stroke="#000" stroke-width="2"/>
    <text x="650" y="332" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">board, back side up</text>
    <text x="300" y="285" font-size="24" font-weight="800" text-anchor="middle">ring</text>
    <text x="474" y="226" font-size="24" font-weight="800" text-anchor="start">${what}</text>
    <path class="cone" d="M384 290 L442 222 H458 L516 290 Z" fill="#e6e6e6" stroke="#000" stroke-width="4"/>
    <g class="iron">
      <path d="M150 60 L415 270" stroke="#555" stroke-width="30" stroke-linecap="round"/>
      <path d="M380 243 L434 286" stroke="#c0c0c0" stroke-width="16" stroke-linecap="round"/>
      <text x="120" y="130" font-size="28" font-weight="800" text-anchor="middle">1. iron</text>
    </g>
    <g class="solder">
      <path d="M760 60 L482 282" stroke="#9a9a9a" stroke-width="9" stroke-linecap="round"/>
      <text x="790" y="130" font-size="28" font-weight="800" text-anchor="middle">2. solder</text>
    </g>
    <text x="450" y="440" font-size="28" font-weight="800" text-anchor="middle">3. a small shiny cone</text>
  </svg>`;
}

function sceneCraftWires() {
  return `<svg viewBox="0 0 900 470" role="img" aria-label="Four jumper wires on the pin strip: yellow on the top pin, then white, red and black. The bottom two pins stay empty.">
    ${craft({ i2cLabels: true })}${headerStrip()}
    ${jumper('yellow', 0, 'jw n1', '1')}${jumper('white', 1, 'jw n2', '2')}${jumper('red', 2, 'jw n3', '3')}${jumper('black', 3, 'jw n4', '4')}
    <text x="820" y="390" font-size="24" font-weight="800" fill="#555" text-anchor="middle">bottom two</text>
    <text x="820" y="418" font-size="24" font-weight="800" fill="#555" text-anchor="middle">stay empty</text>
    <text x="828" y="150" font-size="26" font-weight="800" fill="#ff5a00" text-anchor="middle">top pin</text>
  </svg>`;
}

function sceneCut() {
  const cols = ['black', 'red', 'blue', 'yellow'];
  const Y = k => 186 + k * 32;
  let stubs = '', wires = '', pins = '';
  cols.forEach((c, k) => {
    const f = COL[c].fill;
    const o = LIGHT(c) ? `<path d="M244 ${Y(k)} H690" stroke="#000" stroke-width="16" fill="none"/>` : '';
    stubs += `${LIGHT(c) ? `<path d="M166 ${Y(k)} H216" stroke="#000" stroke-width="16" fill="none"/>` : ''}
              <path d="M166 ${Y(k)} H216" stroke="${f}" stroke-width="10" fill="none"/>`;
    wires += `${o}<path d="M244 ${Y(k)} H690" stroke="${f}" stroke-width="10" fill="none"/>`;
    pins += `<rect x="760" y="${Y(k) - 4}" width="70" height="8" fill="#9a9a9a" stroke="#000" stroke-width="2"/>
             <rect x="686" y="${Y(k) - 12}" width="78" height="24" rx="4" fill="${f}" stroke="#000" stroke-width="4"/>`;
  });
  return `<svg viewBox="0 0 900 470" role="img" aria-label="A Trill cable: a small plug on the left, four wires, and four loose pins on the right. Cut close to the plug and keep the end with the pins.">
    <g class="cutoff">
      <rect x="96" y="160" width="72" height="148" rx="8" fill="#eee" stroke="#000" stroke-width="5"/>
      ${stubs}
    </g>
    ${wires}${pins}
    <path class="pulse" d="M230 120 V350" stroke="#ff5a00" stroke-width="8" stroke-dasharray="14 10" fill="none"/>
    <text x="230" y="98" font-size="30" font-weight="800" fill="#ff5a00" text-anchor="middle">cut here</text>
    <text x="132" y="392" font-size="26" font-weight="800" text-anchor="middle">small plug</text>
    <text x="132" y="424" font-size="24" font-weight="700" fill="#555" text-anchor="middle">not needed</text>
    <text x="750" y="392" font-size="26" font-weight="800" text-anchor="middle">four pins</text>
    <text x="750" y="424" font-size="24" font-weight="700" fill="#555" text-anchor="middle">keep this end</text>
    <text x="450" y="98" font-size="24" font-weight="700" fill="#555" text-anchor="middle">then bare each wire end</text>
  </svg>`;
}

function sceneBar(touch) {
  const cols = ['red', 'black', 'blue', 'yellow'];
  const Y = k => 150 + k * 46;
  let wires = '';
  cols.forEach((c, k) => {
    const f = COL[c].fill, d = `M612 235 C680 235, 660 ${Y(k)}, 720 ${Y(k)} H770`;
    wires += `${LIGHT(c) ? `<path d="${d}" stroke="#000" stroke-width="16" fill="none"/>` : ''}
      <path d="${d}" stroke="${f}" stroke-width="10" fill="none"/>
      <rect x="836" y="${Y(k) - 4}" width="54" height="8" fill="#9a9a9a" stroke="#000" stroke-width="2"/>
      <rect x="766" y="${Y(k) - 13}" width="72" height="26" rx="4" fill="${f}" stroke="#000" stroke-width="4"/>`;
  });
  const finger = touch ? `
    <g class="note"><text x="330" y="120" font-size="80" font-weight="800" fill="#ff5a00">&#9835;</text></g>
    <g class="slide"><g transform="translate(-420 62)">
      <path d="M568 -60 C568 -80, 608 -80, 608 -60 V128 C608 152, 568 152, 568 128 Z" fill="#f2c9a5" stroke="#000" stroke-width="5"/>
      <path d="M574 112 C580 102, 596 102, 602 112" fill="none" stroke="#000" stroke-width="3"/>
    </g></g>` : '';
  return `<svg viewBox="0 0 900 470" role="img" aria-label="The Trill Bar, a long thin sensor. Its cable plugs into one end and finishes in four loose pins: red, black, blue and yellow.">
    <rect x="50" y="200" width="540" height="70" rx="14" fill="#111" stroke="#000" stroke-width="5"/>
    <text x="320" y="246" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">TRILL BAR</text>
    <rect x="584" y="212" width="30" height="46" rx="5" fill="#eee" stroke="#000" stroke-width="4"/>
    ${wires}${finger}
    <text x="600" y="330" font-size="24" font-weight="800" text-anchor="middle">small plug</text>
    <text x="600" y="360" font-size="24" font-weight="700" fill="#555" text-anchor="middle">clicks into the Bar</text>
    <text x="800" y="360" font-size="26" font-weight="800" fill="#ff5a00" text-anchor="middle">four pins</text>
    <text x="800" y="392" font-size="24" font-weight="700" fill="#555" text-anchor="middle">go in the Flipper</text>
  </svg>`;
}

function sceneTail() {
  return `<svg viewBox="0 0 900 470" role="img" aria-label="Four wires soldered into the holes on the flat end of the Craft: yellow in the top hole, then blue, red and black. The bottom two holes stay empty.">
    ${craft({ i2cLabels: true })}
    ${link(true)}
    <text x="820" y="390" font-size="24" font-weight="800" fill="#555" text-anchor="middle">bottom two</text>
    <text x="820" y="418" font-size="24" font-weight="800" fill="#555" text-anchor="middle">stay empty</text>
    <text x="828" y="150" font-size="26" font-weight="800" fill="#ff5a00" text-anchor="middle">top hole</text>
  </svg>`;
}

function sceneTouch() {
  return `<svg viewBox="0 0 900 470" role="img" aria-label="Touch a gold pad on the Craft and a note plays.">
    ${craft({})}${link()}

/* ---------- close-up animation: count the holes, then drop the wire ---------- */
let runToken = 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function animateClose(root, active) {
  const my = ++runToken;
  const wire = root.querySelector('.wire.active');
  const target = HOLE[active.color];
  const seq = [];
  for (let k = 0; k < active.n; k++) seq.push(active.from === 'gap' ? k : 9 - k);
  const ring = i => root.querySelector(`[data-ring="${i}"]`);
  const bubble = i => root.querySelector(`[data-bubble="${i}"]`);
  const label = i => root.querySelector(`[data-bubble-n="${i}"]`);
  const reset = () => {
    for (let i = 0; i < 10; i++) { ring(i).setAttribute('opacity', 0); bubble(i).setAttribute('opacity', 0); }
  };

  if (STILL) {
    seq.forEach((i, k) => { if (i !== target) { label(i).textContent = k + 1; bubble(i).setAttribute('opacity', 1); } });
    ring(target).setAttribute('opacity', 1);
    return;
  }
  while (my === runToken) {
    reset();
    wire.style.transition = 'none';
    wire.style.transform = 'translateY(-120px)';
    await sleep(500); if (my !== runToken) return;
    for (let k = 0; k < seq.length; k++) {
      label(seq[k]).textContent = k + 1;
      bubble(seq[k]).setAttribute('opacity', 1);
      ring(seq[k]).setAttribute('opacity', 1);
      await sleep(750); if (my !== runToken) return;
      if (k < seq.length - 1) ring(seq[k]).setAttribute('opacity', 0);
    }
    await sleep(350); if (my !== runToken) return;
    for (let i = 0; i < 10; i++) bubble(i).setAttribute('opacity', 0);
    wire.style.transition = '';
    wire.style.transform = 'translateY(0)';
    await sleep(3400); if (my !== runToken) return;
  }
}

/* ---------- the sounds the app makes ---------- */
let audio;
function tone(freq, start, dur, vol) {
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'square'; o.frequency.value = freq;
  g.gain.value = vol;
  o.connect(g); g.connect(audio.destination);
  o.start(audio.currentTime + start); o.stop(audio.currentTime + start + dur);
}
function play(kind) {
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  audio.resume();
  if (kind === 'found') { tone(523.25, 0, .07, .12); tone(659.26, .07, .07, .12); tone(783.99, .14, .11, .12); }
  if (kind === 'search') { for (let i = 0; i < 3; i++) tone(330, i * 2, .035, .06); }
  if (kind === 'touch') { tone(523.25, 0, .5, .12); }
}

/* ---------- the steps ---------- */
function buildSteps() {

let STEPS = buildSteps();

/* ---------- stepper ---------- */
const $ = id => document.getElementById(id);
let step = Math.min(Math.max(parseInt(params.get('step') || '1', 10) - 1, 0), STEPS.length - 1);
let readAloud = false;
try { readAloud = localStorage.getItem('pinmap-read') === '1'; } catch (e) {}

function speak() {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  if (!readAloud) return;
  const s = STEPS[step];
  const tmp = document.createElement('div');
  tmp.innerHTML = s.text;
  speechSynthesis.speak(new SpeechSynthesisUtterance(s.title + '. ' + tmp.textContent.replace(/\s+/g, ' ')));
}

function render() {
  const s = STEPS[step];
  runToken++;
  document.title = ROUTE === 'bar' ? 'Bar home test' : 'Craft to Flipper, step by step';
  document.documentElement.classList.toggle('still', STILL);
  $('progress').textContent = `Step ${step + 1} of ${STEPS.length}`;
  $('dots').innerHTML = STEPS.map((_, i) => `<i class="${i < step ? 'done' : i === step ? 'now' : ''}"></i>`).join('');
  $('title').textContent = s.title;
  $('text').innerHTML = s.text;
  $('scene').innerHTML = s.scene ? s.scene() : '';
  $('scene').parentElement.style.display = s.scene ? '' : 'none';
  $('extra').innerHTML = s.extra || '';
  $('back').disabled = step === 0;
  $('next').disabled = step === STEPS.length - 1;
  $('speak').textContent = 'Read aloud: ' + (readAloud ? 'on' : 'off');
  $('speak').classList.toggle('on', readAloud);
  $('motion').textContent = 'Animation: ' + (STILL ? 'off' : 'on');
  $('motion').classList.toggle('on', !STILL);
  if (s.active) animateClose($('scene'), s.active);
  window.scrollTo(0, 0);
  speak();
}

function go(d) {
  const n = step + d;
  if (n < 0 || n >= STEPS.length) return;
  step = n;
  render();
}

$('back').addEventListener('click', () => go(-1));
$('next').addEventListener('click', () => go(1));
$('speak').addEventListener('click', () => {
  readAloud = !readAloud;
  try { localStorage.setItem('pinmap-read', readAloud ? '1' : '0'); } catch (e) {}
  render();
});
$('motion').addEventListener('click', () => {
  STILL = !STILL;
  try { localStorage.setItem('pinmap-motion', STILL ? 'off' : 'on'); } catch (e) {}
  render();
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-play]');
  if (b) play(b.dataset.play);
  const r = e.target.closest('[data-route]');
  if (r) {
    ROUTE = r.dataset.route;
    try { localStorage.setItem('guide-route', ROUTE); } catch (e2) {}
    STEPS = buildSteps();
    render();
  }
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
});

render();
</script>
</body>
</html>
