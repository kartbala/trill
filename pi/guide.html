<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Craft to Raspberry Pi, step by step</title>
<style>
  :root { --ink:#000; --paper:#fff; --dim:#444; --hot:#ff5a00; --red:#d40000; --yellow:#ffd400; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--paper); color:var(--ink); }
  body { font:30px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif; padding:0 0 150px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
           padding:16px 28px; border-bottom:6px solid #000; }
  #progress { font-size:30px; font-weight:800; }
  #dots { display:flex; gap:8px; flex-wrap:wrap; }
  #dots i { width:22px; height:22px; border-radius:50%; border:4px solid #000; background:#fff; }
  #dots i.done { background:#000; }
  #dots i.now { background:var(--hot); border-color:var(--hot); }
  main { padding:20px 28px 0; max-width:1000px; }
  h1 { font-size:54px; line-height:1.1; margin:6px 0 16px; }
  #text p { margin:0 0 12px; }
  #text p.key { font-weight:800; font-size:34px; }
  #text p.warn { background:#000; color:#fff; padding:14px 20px; border-radius:12px; font-weight:700; }
  #text ol, #text ul { margin:0 0 12px; padding-left:40px; }
  #text li { margin-bottom:8px; }
  .scroll { overflow-x:auto; margin:18px 0 8px; }
  #scene svg { display:block; min-width:900px; width:900px; height:auto; }
  #extra { margin-top:14px; }
  button, a.sound { font:inherit; font-weight:800; cursor:pointer; border:5px solid #000; border-radius:16px;
           background:#fff; color:#000; padding:14px 24px; }
  button:focus-visible, a.sound:focus-visible { outline:6px solid var(--hot); outline-offset:3px; }
  .toggles { display:flex; gap:12px; flex-wrap:wrap; }
  #speak, #motion { font-size:26px; padding:10px 18px; }
  #speak.on, #motion.on { background:#000; color:#fff; }
  .sound { display:block; width:100%; max-width:760px; text-align:left; margin:0 0 14px; font-size:30px; text-decoration:none; }
  .sound small { display:block; font-weight:400; font-size:26px; }
  a.sound.go { background:#000; color:#fff; }
  nav { position:fixed; left:0; right:0; bottom:0; display:flex; gap:16px; padding:16px 28px;
        background:#fff; border-top:6px solid #000; }
  nav button { flex:1; font-size:38px; padding:20px 10px; }
  #next { background:#000; color:#fff; }
  nav button:disabled { opacity:.25; cursor:default; }
  details { border:5px solid #000; border-radius:16px; padding:14px 20px; margin-top:16px; }
  summary { font-weight:800; cursor:pointer; }
  details a { color:#000; font-weight:800; }

  /* scene animation */
  .pulse { animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.15; } }
  .bob { animation:bob 1s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(14px); } }
  .flow { stroke-dasharray:18 14; animation:flow 1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset:-32; } }
  .plugv { animation:plugv 3.2s ease-in-out infinite; }
  @keyframes plugv { 0%,20% { transform:translateY(130px); } 55%,100% { transform:translateY(0); } }
  .tap { animation:tap 1.6s ease-in-out infinite; }
  @keyframes tap { 0%,100% { transform:translateY(-46px); } 40%,60% { transform:translateY(0); } }
  .note { animation:note 1.6s ease-out infinite; }
  @keyframes note { 0%,40% { opacity:0; transform:translateY(0); } 50% { opacity:1; } 100% { opacity:0; transform:translateY(-110px); } }
  .wire, .mover { transition:transform .9s cubic-bezier(.3,.7,.3,1); }
  .blob { transform-box:fill-box; transform-origin:50% 100%; transition:transform 1s ease-out; }
  .still .pulse, .still .bob, .still .flow, .still .plugv, .still .tap, .still .note { animation:none; }
  .still .note { opacity:1; transform:translateY(-60px); }
  .still .wire, .still .mover, .still .blob { transition:none; }
</style>
</head>
<body>

<header>
  <div id="progress"></div>
  <div id="dots"></div>
  <div class="toggles">
    <button id="motion" type="button">Animation: on</button>
    <button id="speak" type="button">Read aloud: off</button>
  </div>
</header>

<main>
  <h1 id="title"></h1>
  <div id="text"></div>
  <div class="scroll"><div id="scene"></div></div>
  <div id="extra"></div>
</main>

<nav>
  <button id="back" type="button">&larr; Back</button>
  <button id="next" type="button">Next &rarr;</button>
</nav>

<script>
const params = new URLSearchParams(location.search);
// Animation is on unless switched off with the button. This page was asked for
// with animations, so the system "reduce motion" setting does not silence it.
// The storage keys are the same as the Flipper guide's, so one choice covers both.
let STILL = params.has('still');
try { if (localStorage.getItem('pinmap-motion') === 'off') STILL = true; } catch (e) {}

const COL = {
  red:    { fill:'#d40000', name:'RED' },
  black:  { fill:'#000000', name:'BLACK' },
  white:  { fill:'#ffffff', name:'WHITE' },
  yellow: { fill:'#ffd400', name:'YELLOW' },
};
const GREEN = '#123c2a', GOLD = '#c9a227';
// Pi socket hole, counted from the card end: 0 = pin 1 (3V3), 1 = pin 3 (SDA),
// 2 = pin 5 (SCL), 3 = pin 7 (unused), 4 = pin 9 (ground)
const HOLE = { red:0, white:1, yellow:2, black:4 };
// Craft pin, counted from the left with the chip up and the pins pointing away:
// 0 SCL, 1 SDA, 2 +V, 3 GND, 4 EVT, 5 RST
const CPIN = { yellow:0, white:1, red:2, black:3 };

/* ---------- scene: the whole Pi, chip side up, card on the left ---------- */
// Drawn to the Raspberry Pi Zero W mechanical drawing, 12 px per millimetre.
function piBoard(x, y) {
  const S = 12, X = v => x + v * S, Y = v => y + v * S;
  let holes = '';
  for (let c = 0; c < 20; c++) for (const r of [2.23, 4.77]) {
    holes += `<circle cx="${X(8.37 + c * 2.54)}" cy="${Y(r)}" r="8" fill="${GOLD}" stroke="#000" stroke-width="2"/>
              <circle cx="${X(8.37 + c * 2.54)}" cy="${Y(r)}" r="3.5" fill="#000"/>`;
  }
  let mounts = '';
  for (const [mx, my] of [[3.5, 3.5], [61.5, 3.5], [3.5, 26.5], [61.5, 26.5]]) {
    mounts += `<circle cx="${X(mx)}" cy="${Y(my)}" r="20" fill="${GOLD}" stroke="#000" stroke-width="2"/><circle cx="${X(mx)}" cy="${Y(my)}" r="12" fill="#fff"/>`;
  }
  return `
    <rect x="${X(-3.5)}" y="${Y(8.5)}" width="${5 * S}" height="${9.5 * S}" rx="5" fill="#222" stroke="#000" stroke-width="3"/>
    <rect x="${x}" y="${y}" width="${65 * S}" height="${30 * S}" rx="36" fill="${GREEN}" stroke="#000" stroke-width="5"/>
    ${mounts}${holes}
    <rect x="${X(-0.5)}" y="${Y(7.5)}" width="${12 * S}" height="${11.5 * S}" rx="6" fill="#bbb" stroke="#000" stroke-width="4"/>
    <rect x="${X(25)}" y="${Y(10.5)}" width="${12 * S}" height="${12 * S}" rx="6" fill="#1d1d1d" stroke="#777" stroke-width="3"/>
    <rect x="${X(61)}" y="${Y(7)}" width="${4.5 * S}" height="${16 * S}" rx="4" fill="#ddd" stroke="#000" stroke-width="3"/>
    <rect x="${X(6.8)}" y="${Y(24.3)}" width="${11.2 * S}" height="${7.2 * S}" rx="5" fill="#bbb" stroke="#000" stroke-width="4"/>
    <rect x="${X(37.4)}" y="${Y(25)}" width="${8 * S}" height="${6.5 * S}" rx="5" fill="#bbb" stroke="#000" stroke-width="4"/>
    <rect x="${X(50)}" y="${Y(25)}" width="${8 * S}" height="${6.5 * S}" rx="5" fill="#bbb" stroke="#000" stroke-width="4"/>`;
}

function sceneLandmarks() {
  return `<svg viewBox="0 0 900 600" role="img" aria-label="The Pi from above. The card slot is on the left. Two rows of small holes run along the far edge. Three sockets sit on the near edge.">
    ${piBoard(60, 120)}
    <text x="450" y="50" font-size="28" font-weight="800" text-anchor="middle">two rows of small holes</text>
    <path d="M152 104 V86 H748 V104" fill="none" stroke="#000" stroke-width="5"/>
    <rect class="pulse" x="46" y="202" width="164" height="154" rx="12" fill="none" stroke="#ff5a00" stroke-width="8"/>
    <text x="126" y="290" font-size="28" font-weight="800" text-anchor="middle">card</text>
    <text x="432" y="327" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">chip</text>
    <path d="M142 512 V530 H756 V512" fill="none" stroke="#000" stroke-width="5"/>
    <text x="450" y="574" font-size="28" font-weight="800" text-anchor="middle">three sockets</text>
  </svg>`;
}

function scenePlug() {
  return `<svg viewBox="0 0 900 640" role="img" aria-label="The cable goes into the middle of the three sockets. The end socket is for power only.">
    ${piBoard(60, 40)}
    <rect class="pulse" x="497" y="328" width="120" height="102" rx="12" fill="none" stroke="#ff5a00" stroke-width="8"/>
    <g class="plugv">
      <rect x="535" y="404" width="44" height="40" fill="#999" stroke="#000" stroke-width="3"/>
      <rect x="521" y="440" width="72" height="80" rx="10" fill="#000"/>
      <path d="M557 520 V700" stroke="#000" stroke-width="16" fill="none"/>
    </g>
    <text x="209" y="476" font-size="26" font-weight="800" fill="#555" text-anchor="middle">screen socket</text>
    <text x="209" y="508" font-size="26" font-weight="800" fill="#555" text-anchor="middle">leave empty</text>
    <text x="740" y="476" font-size="26" font-weight="800" fill="#555" text-anchor="middle">power only</text>
    <text x="740" y="508" font-size="26" font-weight="800" fill="#555" text-anchor="middle">not this one</text>
    <text x="620" y="590" font-size="30" font-weight="800" fill="#ff5a00">middle: use this</text>
  </svg>`;
}

/* ---------- scene: the card-end corner of the Pi, close up ---------- */
// 36 px per millimetre. Chip side: the board's top edge is at y = 170.
const CX = c => 144 + (8.37 + c * 2.54) * 36;     // centre of hole column c
const ROW_EDGE = 170 + 2.23 * 36, ROW_IN = 170 + 4.77 * 36;

function cornerTop(opts) {
  let holes = '', nums = '', rings = '', bubbles = '';
  for (let c = 0; c < 6; c++) {
    holes += `<circle cx="${CX(c)}" cy="${ROW_EDGE}" r="34" fill="#8a8a8a" stroke="#000" stroke-width="3"/><circle cx="${CX(c)}" cy="${ROW_EDGE}" r="16" fill="#000"/>
              <circle cx="${CX(c)}" cy="${ROW_IN}" r="34" fill="${GOLD}" stroke="#000" stroke-width="3"/><circle cx="${CX(c)}" cy="${ROW_IN}" r="16" fill="#000"/>`;
  }
  for (let c = 0; c < 5; c++) {
    nums += `<text x="${CX(c)}" y="424" font-size="${c === 0 ? 40 : 30}" font-weight="800" fill="${c === 0 ? '#ff5a00' : '#fff'}" text-anchor="middle">${c + 1}</text>`;
    rings += `<circle data-ring="${c}" cx="${CX(c)}" cy="${ROW_IN}" r="44" fill="none" stroke="#ff5a00" stroke-width="9" opacity="0"/>`;
    bubbles += `<g data-bubble="${c}" opacity="0"><circle cx="${CX(c)}" cy="${ROW_IN}" r="32" fill="#ff5a00"/>
      <text data-bubble-n="${c}" x="${CX(c)}" y="${ROW_IN + 12}" font-size="34" font-weight="800" fill="#fff" text-anchor="middle"></text></g>`;
  }
  let socket = '';
  if (opts.socket) {
    let sq = '';
    for (let c = 0; c < 5; c++) sq += `<rect x="${CX(c) - 22}" y="${ROW_IN - 22}" width="44" height="44" rx="5" fill="#000" stroke="#fff" stroke-width="4"/>`;
    socket = `<g class="mover"><rect x="${CX(0) - 46}" y="${ROW_IN - 44}" width="${CX(4) - CX(0) + 92}" height="88" rx="8" fill="#333" stroke="#000" stroke-width="5"/>${sq}</g>`;
  }
  const hole1 = opts.socket ? '' : `<circle class="pulse" cx="${CX(0)}" cy="${ROW_IN}" r="46" fill="none" stroke="#ff5a00" stroke-width="9"/>`;
  return `<svg viewBox="0 0 900 700" role="img" aria-label="${opts.label}">
    <circle cx="60" cy="42" r="20" fill="#8a8a8a" stroke="#000" stroke-width="3"/><circle cx="60" cy="42" r="9" fill="#000"/>
    <text x="96" y="52" font-size="28" font-weight="800" fill="#555">edge row: leave empty</text>
    <circle cx="60" cy="100" r="20" fill="${GOLD}" stroke="#000" stroke-width="3"/><circle cx="60" cy="100" r="9" fill="#000"/>
    <text x="96" y="110" font-size="28" font-weight="800">inner row: use this</text>
    <rect x="18" y="476" width="180" height="342" rx="10" fill="#222" stroke="#000" stroke-width="4"/>
    <rect x="144" y="170" width="900" height="700" rx="108" fill="${GREEN}" stroke="#000" stroke-width="5"/>
    <circle cx="270" cy="296" r="92" fill="${GOLD}" stroke="#000" stroke-width="3"/><circle cx="270" cy="296" r="50" fill="#fff" stroke="#000" stroke-width="3"/>
    ${holes}${nums}
    <rect x="126" y="440" width="432" height="414" rx="12" fill="#bbb" stroke="#000" stroke-width="5"/>
    <text x="342" y="580" font-size="40" font-weight="800" text-anchor="middle">card slot</text>
    ${hole1}${rings}${socket}${bubbles}
  </svg>`;
}

// The same corner after rolling the board over: the chips face the table, the
// card is still on the left, and the hole rows are now on the near edge.
function cornerBack() {
  const yIn = 470 - 4.77 * 36, yEdge = 470 - 2.23 * 36;
  let holes = '';
  for (let c = 0; c < 6; c++) {
    holes += `<circle cx="${CX(c)}" cy="${yEdge}" r="34" fill="#8a8a8a" stroke="#000" stroke-width="3"/><circle cx="${CX(c)}" cy="${yEdge}" r="16" fill="#000"/>
              <circle cx="${CX(c)}" cy="${yIn}" r="34" fill="${GOLD}" stroke="#000" stroke-width="3"/>`;
    holes += c < 5 ? `<rect x="${CX(c) - 13}" y="${yIn - 13}" width="26" height="26" fill="#e8e8e8" stroke="#000" stroke-width="4"/>
                      <circle class="pulse" cx="${CX(c)}" cy="${yIn}" r="44" fill="none" stroke="#ff5a00" stroke-width="8"/>`
                   : `<circle cx="${CX(c)}" cy="${yIn}" r="16" fill="#000"/>`;
  }
  return `<svg viewBox="0 0 900 560" role="img" aria-label="The back of the board. Five short legs poke up through the inner row. Solder those five.">
    <rect x="18" y="-200" width="180" height="364" rx="10" fill="#222" stroke="#000" stroke-width="4"/>
    <text x="81" y="120" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">card</text>
    <rect x="144" y="-300" width="900" height="770" rx="108" fill="#0c2a1d" stroke="#000" stroke-width="5"/>
    <circle cx="270" cy="344" r="92" fill="${GOLD}" stroke="#000" stroke-width="3"/><circle cx="270" cy="344" r="50" fill="#fff" stroke="#000" stroke-width="3"/>
    ${holes}
    <text x="628" y="214" font-size="32" font-weight="800" fill="#ff5a00" text-anchor="middle">five legs: solder these</text>
    <text x="628" y="70" font-size="28" font-weight="800" fill="#fff" text-anchor="middle">back of the board</text>
    <text x="628" y="524" font-size="28" font-weight="800" fill="#555" text-anchor="middle">edge row: no solder</text>
  </svg>`;
}

/* ---------- scene: one solder joint, seen from the side ---------- */
function sceneSolder() {
  const leg = x => `<rect x="${x - 50}" y="352" width="100" height="8" fill="${GOLD}" stroke="#000" stroke-width="2"/>
                    <rect x="${x - 10}" y="262" width="20" height="150" fill="#c8c8c8" stroke="#000" stroke-width="3"/>`;
  return `<svg viewBox="0 0 900 560" role="img" aria-label="Side view of one solder joint. The iron tip touches the leg and the gold ring. Then the solder touches the leg and melts into a small cone.">
    <text id="cap" x="450" y="52" font-size="32" font-weight="800" text-anchor="middle"></text>
    <rect x="130" y="412" width="640" height="110" rx="8" fill="#333" stroke="#000" stroke-width="5"/>
    <text x="450" y="480" font-size="28" font-weight="800" fill="#fff" text-anchor="middle">socket, under the board</text>
    ${leg(230)}${leg(450)}${leg(670)}
    <rect x="40" y="360" width="820" height="52" fill="${GREEN}" stroke="#000" stroke-width="5"/>
    <path class="blob" d="M404 358 Q440 344 441 270 H459 Q460 344 496 358 Z" fill="#dcdcdc" stroke="#000" stroke-width="4"/>
    <g class="mover" data-m="iron">
      <path d="M200 120 L360 280" stroke="#000" stroke-width="54" stroke-linecap="round"/>
      <path d="M200 120 L360 280" stroke="#ff5a00" stroke-width="42" stroke-linecap="round"/>
      <path d="M360 280 L432 350" stroke="#000" stroke-width="22" stroke-linecap="round"/>
      <path d="M360 280 L432 350" stroke="#9a9a9a" stroke-width="14" stroke-linecap="round"/>
      <text x="290" y="160" font-size="28" font-weight="800">iron</text>
    </g>
    <g class="mover" data-m="solder">
      <path d="M800 90 L470 330" stroke="#000" stroke-width="12" stroke-linecap="round"/>
      <path d="M800 90 L470 330" stroke="#c8c8c8" stroke-width="6" stroke-linecap="round"/>
      <text x="690" y="250" font-size="28" font-weight="800">solder</text>
    </g>
    <g id="count" opacity="0"><circle cx="450" cy="170" r="46" fill="#ff5a00"/>
      <text id="countN" x="450" y="188" font-size="50" font-weight="800" fill="#fff" text-anchor="middle"></text></g>
  </svg>`;
}

function sceneJoints() {
  const board = x => `<rect x="${x - 120}" y="300" width="240" height="44" fill="${GREEN}" stroke="#000" stroke-width="4"/>`;
  const leg = x => `<rect x="${x - 9}" y="196" width="18" height="104" fill="#c8c8c8" stroke="#000" stroke-width="3"/>`;
  return `<svg viewBox="0 130 900 340" role="img" aria-label="Three joints from the side. Good: a small cone around the leg. Bad: a ball that sits on the leg. Bad: one lump that joins two legs.">
    ${board(150)}${leg(150)}
    <path d="M100 300 Q142 286 141 210 H159 Q158 286 200 300 Z" fill="#dcdcdc" stroke="#000" stroke-width="4"/>
    <rect class="pulse" x="18" y="150" width="264" height="300" rx="16" fill="none" stroke="#ff5a00" stroke-width="8"/>
    <text x="150" y="392" font-size="34" font-weight="800" text-anchor="middle">GOOD</text>
    <text x="150" y="430" font-size="26" font-weight="700" text-anchor="middle">a small cone</text>
    ${board(450)}${leg(450)}
    <circle cx="450" cy="244" r="38" fill="#dcdcdc" stroke="#000" stroke-width="4"/>
    <text x="450" y="392" font-size="34" font-weight="800" text-anchor="middle">NO</text>
    <text x="450" y="430" font-size="26" font-weight="700" text-anchor="middle">a ball on the leg</text>
    ${board(750)}${leg(705)}${leg(795)}
    <rect x="672" y="244" width="156" height="56" rx="26" fill="#dcdcdc" stroke="#000" stroke-width="4"/>
    <text x="750" y="392" font-size="34" font-weight="800" text-anchor="middle">NO</text>
    <text x="750" y="430" font-size="26" font-weight="700" text-anchor="middle">two legs joined</text>
  </svg>`;
}

/* ---------- scene: overview, the Craft, touch ---------- */
function craftBoard(x, y, w, h) {
  let pads = '';
  const n = 15, step = (w - 60) / (n - 1);
  for (let i = 0; i < n; i++) {
    pads += `<circle cx="${x + 30 + i*step}" cy="${y + 20}" r="9" fill="${GOLD}" stroke="#000" stroke-width="2"/>`;
    pads += `<circle cx="${x + 30 + i*step}" cy="${y + h - 20}" r="9" fill="${GOLD}" stroke="#000" stroke-width="2"/>`;
  }
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14" fill="${GREEN}" stroke="#000" stroke-width="5"/>${pads}
    <text x="${x + w/2}" y="${y + h/2 + 12}" font-size="34" font-weight="800" fill="#fff" text-anchor="middle">Craft</text>`;
}

function sceneOverview() {
  const ys = [170, 200, 230, 260], cols = ['red', 'white', 'yellow', 'black'];
  let wires = '';
  cols.forEach((c, i) => {
    if (c === 'white') wires += `<path d="M196 ${ys[i]} H330" stroke="#000" stroke-width="14" fill="none"/>`;
    wires += `<path class="flow" d="M196 ${ys[i]} H330" stroke="${COL[c].fill}" stroke-width="9" fill="none"/>`;
  });
  let dots = '';
  for (let i = 0; i < 9; i++) dots += `<circle cx="${352 + i * 22}" cy="152" r="6" fill="${GOLD}"/>`;
  return `<svg viewBox="0 0 900 440" role="img" aria-label="Four wires run from the Craft to the Pi. One cable runs from the Pi to the Mac. The Mac plays the note.">
    <rect x="20" y="130" width="176" height="170" rx="14" fill="${GREEN}" stroke="#000" stroke-width="5"/>
    <text x="108" y="228" font-size="34" font-weight="800" fill="#fff" text-anchor="middle">Craft</text>
    ${wires}
    <rect x="330" y="130" width="220" height="170" rx="18" fill="${GREEN}" stroke="#000" stroke-width="5"/>
    ${dots}
    <text x="440" y="240" font-size="34" font-weight="800" fill="#fff" text-anchor="middle">Pi</text>
    <path d="M550 215 H664" stroke="#000" stroke-width="18" fill="none"/>
    <path class="flow" d="M550 215 H664" stroke="#fff" stroke-width="6" fill="none"/>
    <rect x="664" y="120" width="200" height="140" rx="10" fill="#1d1d1d" stroke="#000" stroke-width="5"/>
    <path d="M640 262 H888 L870 300 H658 Z" fill="#dcdcdc" stroke="#000" stroke-width="5"/>
    <text x="764" y="204" font-size="34" font-weight="800" fill="#fff" text-anchor="middle">Mac</text>
    <g class="note"><text x="736" y="120" font-size="80" font-weight="800" fill="#ff5a00">&#9835;</text></g>
    <text x="263" y="112" font-size="28" font-weight="800" text-anchor="middle">4 wires</text>
    <text x="607" y="112" font-size="28" font-weight="800" text-anchor="middle">1 cable</text>
    <text x="108" y="350" font-size="26" font-weight="800" text-anchor="middle">feels</text>
    <text x="108" y="382" font-size="26" font-weight="800" text-anchor="middle">the touch</text>
    <text x="440" y="350" font-size="26" font-weight="800" text-anchor="middle">reads which</text>
    <text x="440" y="382" font-size="26" font-weight="800" text-anchor="middle">pad it was</text>
    <text x="764" y="350" font-size="26" font-weight="800" text-anchor="middle">makes</text>
    <text x="764" y="382" font-size="26" font-weight="800" text-anchor="middle">the sound</text>
  </svg>`;
}

function sceneTouch() {

/* ---------- animations ---------- */
let runToken = 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));

// Count along the holes from the card end, then let the moving part drop in.
async function animateCount(root, spec) {
  const my = ++runToken;
  const mover = root.querySelector(spec.mover);
  const ring = i => root.querySelector(`[data-ring="${i}"]`);
  const bubble = i => root.querySelector(`[data-bubble="${i}"]`);
  const label = i => root.querySelector(`[data-bubble-n="${i}"]`);
  const all = spec.total;
  const reset = () => { for (let i = 0; i < all; i++) { ring(i).setAttribute('opacity', 0); bubble(i).setAttribute('opacity', 0); } };

  if (STILL) {
    if (spec.target === null) return;   // the socket simply sits in place
    for (let k = 0; k < spec.n; k++) if (k !== spec.target) { label(k).textContent = k + 1; bubble(k).setAttribute('opacity', 1); }
    ring(spec.target).setAttribute('opacity', 1);
    return;
  }
  while (my === runToken) {
    reset();
    mover.style.transition = 'none';
    mover.style.transform = `translateY(${spec.lift}px)`;
    await sleep(500); if (my !== runToken) return;
    for (let k = 0; k < spec.n; k++) {
      label(k).textContent = k + 1;
      bubble(k).setAttribute('opacity', 1);
      ring(k).setAttribute('opacity', 1);
      await sleep(750); if (my !== runToken) return;
      if (k < spec.n - 1 || spec.target === null) ring(k).setAttribute('opacity', 0);
    }
    await sleep(350); if (my !== runToken) return;
    for (let i = 0; i < all; i++) bubble(i).setAttribute('opacity', 0);
    mover.style.transition = '';
    mover.style.transform = 'translateY(0)';
    await sleep(3400); if (my !== runToken) return;
  }
}

// The four wires go onto the Craft one after another.
async function animateSeq(root) {
  const my = ++runToken;
  const wires = [...root.querySelectorAll('.wire')];
  const ring = i => root.querySelector(`[data-ring="${i}"]`);
  if (STILL) return;
  while (my === runToken) {
    wires.forEach(w => { w.style.transition = 'none'; w.style.transform = 'translateY(-150px)'; });
    await sleep(600); if (my !== runToken) return;
    for (let k = 0; k < wires.length; k++) {
      ring(k).setAttribute('opacity', 1);
      await sleep(500); if (my !== runToken) return;
      wires[k].style.transition = '';
      wires[k].style.transform = 'translateY(0)';
      await sleep(1100); if (my !== runToken) return;
      ring(k).setAttribute('opacity', 0);
    }
    await sleep(3000); if (my !== runToken) return;
  }
}

// One solder joint: iron in, count to three, solder in, solder out, iron out.
async function animateSolder(root) {
  const my = ++runToken;
  const iron = root.querySelector('[data-m="iron"]'), solder = root.querySelector('[data-m="solder"]');
  const blob = root.querySelector('.blob'), cap = root.querySelector('#cap');
  const count = root.querySelector('#count'), countN = root.querySelector('#countN');
  const OUT_I = 'translate(-90px,-60px)', OUT_S = 'translate(90px,-70px)';
  if (STILL) {
    cap.textContent = 'Iron on the leg and the ring. Solder on the leg.';
    return;
  }
  while (my === runToken) {
    for (const el of [iron, solder, blob]) el.style.transition = 'none';
    iron.style.transform = OUT_I; solder.style.transform = OUT_S; blob.style.transform = 'scaleY(0)';
    cap.textContent = '1. Iron touches the leg and the ring';
    await sleep(500); if (my !== runToken) return;
    for (const el of [iron, solder, blob]) el.style.transition = '';
    iron.style.transform = 'translate(0,0)';
    await sleep(1500); if (my !== runToken) return;
    cap.textContent = '2. Count to three';
    count.setAttribute('opacity', 1);
    for (let n = 1; n <= 3; n++) { countN.textContent = n; await sleep(800); if (my !== runToken) return; }
    count.setAttribute('opacity', 0);
    cap.textContent = '3. Touch the solder to the leg';
    solder.style.transform = 'translate(0,0)';
    await sleep(900); if (my !== runToken) return;
    blob.style.transform = 'scaleY(1)';
    await sleep(1600); if (my !== runToken) return;
    cap.textContent = '4. Solder away first';
    solder.style.transform = OUT_S;
    await sleep(1300); if (my !== runToken) return;
    cap.textContent = '5. Then the iron away';
    iron.style.transform = OUT_I;
    await sleep(1500); if (my !== runToken) return;
    cap.textContent = 'Done. Hold still while it cools.';
    await sleep(2600); if (my !== runToken) return;
  }
}

/* ---------- the sounds the player page makes ---------- */
let audio;
function tone(freq, start, dur, vol, type) {
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type || 'square'; o.frequency.value = freq;
  g.gain.value = vol;
  o.connect(g); g.connect(audio.destination);
  o.start(audio.currentTime + start); o.stop(audio.currentTime + start + dur);
}
function play(kind) {
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  audio.resume();
  if (kind === 'found') { tone(523.25, 0, .07, .12); tone(659.26, .07, .07, .12); tone(783.99, .14, .11, .12); }
  if (kind === 'search') { for (let i = 0; i < 3; i++) tone(330, i * 2, .035, .06); }
  if (kind === 'touch') { tone(261.63, 0, .6, .2, 'triangle'); }
}

/* ---------- stepper ---------- */
const $ = id => document.getElementById(id);
let step = Math.min(Math.max(parseInt(params.get('step') || '1', 10) - 1, 0), STEPS.length - 1);
let readAloud = false;
try { readAloud = localStorage.getItem('pinmap-read') === '1'; } catch (e) {}

function speak() {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  if (!readAloud) return;
  const s = STEPS[step];
  const tmp = document.createElement('div');
  tmp.innerHTML = s.text;
  speechSynthesis.speak(new SpeechSynthesisUtterance(s.title + '. ' + tmp.textContent.replace(/\s+/g, ' ')));
}

function render() {
  const s = STEPS[step];
  runToken++;
  $('progress').textContent = `Step ${step + 1} of ${STEPS.length}`;
  $('dots').innerHTML = STEPS.map((_, i) => `<i class="${i < step ? 'done' : i === step ? 'now' : ''}"></i>`).join('');
  $('title').textContent = s.title;
  $('text').innerHTML = s.text;
  $('scene').innerHTML = s.scene ? s.scene() : '';
  $('scene').parentElement.style.display = s.scene ? '' : 'none';
  $('extra').innerHTML = s.extra || '';
  $('back').disabled = step === 0;
  $('next').disabled = step === STEPS.length - 1;
  $('speak').textContent = 'Read aloud: ' + (readAloud ? 'on' : 'off');
  $('speak').classList.toggle('on', readAloud);
  $('motion').textContent = 'Animation: ' + (STILL ? 'off' : 'on');
  $('motion').classList.toggle('on', !STILL);
  document.documentElement.classList.toggle('still', STILL);
  if (s.anim && s.anim.type === 'count') animateCount($('scene'), s.anim);
  if (s.anim && s.anim.type === 'seq') animateSeq($('scene'));
  if (s.anim && s.anim.type === 'solder') animateSolder($('scene'));
  window.scrollTo(0, 0);
  speak();
}

function go(d) {
  const n = step + d;
  if (n < 0 || n >= STEPS.length) return;
  step = n;
  render();
}

$('back').addEventListener('click', () => go(-1));
$('next').addEventListener('click', () => go(1));
$('speak').addEventListener('click', () => {
  readAloud = !readAloud;
  try { localStorage.setItem('pinmap-read', readAloud ? '1' : '0'); } catch (e) {}
  render();
});
$('motion').addEventListener('click', () => {
  STILL = !STILL;
  try { localStorage.setItem('pinmap-motion', STILL ? 'off' : 'on'); } catch (e) {}
  render();
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-play]');
  if (b) play(b.dataset.play);
});
document.addEventListener('keydown', e => {
  if ((e.target.tagName === 'BUTTON' || e.target.tagName === 'A' || e.target.tagName === 'SUMMARY') && (e.key === ' ' || e.key === 'Enter')) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
});

render();
</script>
</body>
</html>
