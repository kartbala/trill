<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05060d">
<title>Air Theremin</title>
<style>
  :root {
    --bg: #05060d;
    --ink: #ffffff;
    --dim: #c9cde0;
    --accent: #ffd23f;
    --btn: #1b1f36;
    --btn-on: #ffd23f;
    --btn-on-ink: #05060d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action: none; }
  canvas#stage { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  video { display: none; }
  #note { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center;
    font-size: 64px; font-weight: 800; letter-spacing: 1px; pointer-events: none; text-shadow: 0 2px 12px #000; }
  #hint { position: fixed; top: calc(max(12px, env(safe-area-inset-top)) + 84px); left: 16px; right: 16px; text-align: center;
    font-size: 22px; color: var(--dim); pointer-events: none; text-shadow: 0 2px 8px #000; line-height: 1.35; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 12px max(14px, env(safe-area-inset-bottom));
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    background: linear-gradient(to top, rgba(5,6,13,.95), rgba(5,6,13,0)); }
  #bar button { font: inherit; font-size: 22px; font-weight: 700; color: var(--ink); background: var(--btn);
    border: 2px solid #3a4170; border-radius: 16px; padding: 14px 18px; min-height: 60px; min-width: 110px; }
  #bar button.on { background: var(--btn-on); color: var(--btn-on-ink); border-color: var(--btn-on); }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 26px; background: var(--bg); padding: 24px; text-align: center; z-index: 5; }
  #start h1 { font-size: 48px; margin: 0; }
  #start p { font-size: 24px; color: var(--dim); max-width: 560px; margin: 0; line-height: 1.4; }
  #start button { font: inherit; font-size: 30px; font-weight: 800; padding: 22px 40px; border-radius: 22px;
    border: 0; background: var(--accent); color: var(--btn-on-ink); }
  #err { font-size: 22px; color: #ff8a8a; max-width: 560px; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<video id="cam" playsinline muted></video>
<div id="note"></div>
<div id="hint"></div>

<div id="bar">
  <button id="bHand">✋ Hand</button>
  <button id="bTouch">👆 Touch</button>
  <button id="bSnap">Glide</button>
  <button id="bTone">Tone: Classic</button>
</div>

<div id="start">
  <h1>Air Theremin</h1>
  <p>Raise and lower your hand in front of the camera to change the pitch. Pinch your fingers to go quiet, and open your hand to get louder.</p>
  <button id="go">Tap to play</button>
  <div id="err"></div>
</div>

<script type="module">
const MP = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.34";
const MODEL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

// Range: A2 (110 Hz) to A5 (880 Hz), three octaves.
const F_LO = 110, OCTAVES = 3;
// A minor pentatonic, used when Snap is on.
const SCALE = [0, 3, 5, 7, 10];
const NAMES = ["A", "A♯", "B", "C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯"];

const TONES = {
  Classic: { real: [0, 1, 0.18, 0.06, 0.02], filter: 6000 },
  Glass:   { real: [0, 1, 0.55, 0.32, 0, 0.18, 0, 0.08], filter: 9000 },
  Reed:    { real: [0, ...Array.from({ length: 16 }, (_, i) => 1 / (i + 1))], filter: 2400 },
};

const $ = (id) => document.getElementById(id);
// Touch mode uses this band of the screen height, clear of the text and buttons.
const TOUCH_TOP = 0.22, TOUCH_BOT = 0.76;
const canvas = $("stage"), ctx = canvas.getContext("2d");
const video = $("cam");

const state = {
  mode: "hand",          // hand | touch | midi
  snap: false,
  tone: "Classic",
  pos: 0.5,              // 0..1 pitch position
  vol: 0,                // 0..1 target volume
  shownVol: 0,
  hands: [],             // landmark sets for drawing
  touching: false,
  lastMidi: 0,
};

// ---------- audio ----------
let ac, osc, gain, filter, lfo, lfoGain;

function buildAudio() {
  ac = new (window.AudioContext || window.webkitAudioContext)();
  osc = ac.createOscillator();
  filter = ac.createBiquadFilter();
  filter.type = "lowpass";
  gain = ac.createGain();
  gain.gain.value = 0;

  // Gentle vibrato, about 7 cents.
  lfo = ac.createOscillator();
  lfo.frequency.value = 5.5;
  lfoGain = ac.createGain();
  lfo.connect(lfoGain).connect(osc.frequency);

  // A little echo so it floats.
  const delay = ac.createDelay(1.0);
  delay.delayTime.value = 0.28;
  const fb = ac.createGain(); fb.gain.value = 0.32;
  const wet = ac.createGain(); wet.gain.value = 0.28;
  const comp = ac.createDynamicsCompressor();

  osc.connect(filter).connect(gain);
  gain.connect(comp);
  gain.connect(delay);
  delay.connect(fb).connect(delay);
  delay.connect(wet).connect(comp);
  comp.connect(ac.destination);

  setTone(state.tone);
  osc.start(); lfo.start();
}

function setTone(name) {
  const t = TONES[name];
  const real = new Float32Array(t.real);
  const imag = new Float32Array(real.length);
  osc.setPeriodicWave(ac.createPeriodicWave(real, imag));
  filter.frequency.value = t.filter;
}

function posToSemis(p) {
  let s = Math.max(0, Math.min(1, p)) * OCTAVES * 12;
  if (state.snap) {
    const oct = Math.floor(s / 12), within = s - oct * 12;
    let best = SCALE[0], bd = 99;
    for (const d of [...SCALE, 12]) { const dd = Math.abs(within - d); if (dd < bd) { bd = dd; best = d; } }
    s = oct * 12 + best;
  }
  return s;
}

function updateAudio() {
  if (!ac) return;
  const semis = posToSemis(state.pos);
  const f = F_LO * Math.pow(2, semis / 12);
  const t = ac.currentTime;
  osc.frequency.setTargetAtTime(f, t, state.snap ? 0.025 : 0.02);
  lfoGain.gain.setTargetAtTime(f * 0.004, t, 0.1);
  gain.gain.setTargetAtTime(state.vol * 0.5, t, 0.04);
  const n = Math.round(semis);
  $("note").textContent = state.vol > 0.03 ? NAMES[n % 12] + (Math.floor((n + 9) / 12) + 2) : "";
}

// ---------- hand tracking ----------
let landmarker = null, lastVideoTime = -1;

async function startHand() {
  if (!landmarker) {
    $("hint").textContent = "Loading hand tracking…";
    const { FilesetResolver, HandLandmarker } = await import(MP + "/vision_bundle.mjs");
    const files = await FilesetResolver.forVisionTasks(MP + "/wasm");
    const opts = (delegate) => ({
      baseOptions: { modelAssetPath: MODEL, delegate },
      runningMode: "VIDEO", numHands: 2,
      minHandDetectionConfidence: 0.5, minTrackingConfidence: 0.5,
    });
    try { landmarker = await HandLandmarker.createFromOptions(files, opts("GPU")); }
    catch (e) { landmarker = await HandLandmarker.createFromOptions(files, opts("CPU")); }
  }
  if (!video.srcObject) {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }, audio: false,
    });
    video.srcObject = stream;
    await video.play();
  }
  $("hint").textContent = "Hand up = higher.  Pinch = quiet.  A second hand, if you use one, sets the volume.";
}

function trackHands() {
  if (state.mode !== "hand" || !landmarker || video.readyState < 2) return;
  if (video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const res = landmarker.detectForVideo(video, performance.now());
  const hands = res.landmarks || [];
  state.hands = hands;
  if (!hands.length) { state.vol = 0; return; }

  // The hand on the right of the (mirrored) screen plays pitch.
  const sorted = [...hands].sort((a, b) => a[8].x - b[8].x); // raw x small = screen right
  const pitchHand = sorted[0];
  const tip = pitchHand[8];
  state.pos = 1 - clamp((tip.y - 0.1) / 0.8);

  if (sorted.length > 1) {
    const volHand = sorted[1];
    state.vol = 1 - clamp((volHand[9].y - 0.15) / 0.7);
  } else {
    // Pinch: thumb tip to index tip, scaled by hand size.
    const size = dist(pitchHand[0], pitchHand[9]) || 0.1;
    const pinch = dist(pitchHand[4], pitchHand[8]) / size;
    state.vol = clamp((pinch - 0.18) / 0.9);
  }
}

// ---------- touch ----------
function onPointer(e) {
  if (state.mode !== "touch" || e.target !== canvas) return;
  if (e.type === "pointerup" || e.type === "pointercancel") { state.touching = false; state.vol = 0; return; }
  if (e.type === "pointerdown") state.touching = true;
  if (!state.touching) return;
  // Same as hand mode: up = higher. Further right = louder.
  state.pos = clamp((TOUCH_BOT - e.clientY / innerHeight) / (TOUCH_BOT - TOUCH_TOP));
  state.vol = 0.25 + 0.75 * clamp(e.clientX / innerWidth);
}
["pointerdown", "pointermove", "pointerup", "pointercancel"].forEach((t) => canvas.addEventListener(t, onPointer));

// ---------- MIDI (for the Trill + Pi later) ----------
// Pitch bend = pitch position, CC7 or CC11 = volume, a note-on jumps to that note.
async function startMidi() {
  if (!navigator.requestMIDIAccess) return;
  try {
    const access = await navigator.requestMIDIAccess();
    const hook = () => access.inputs.forEach((inp) => (inp.onmidimessage = onMidi));
    hook(); access.onstatechange = hook;
  } catch (e) { /* MIDI is optional */ }
}
function onMidi({ data }) {
  const [st, a, b] = data, kind = st & 0xf0;
  state.lastMidi = performance.now();
  if (kind === 0xe0) state.pos = ((b << 7) | a) / 16383;
  else if (kind === 0xb0 && (a === 7 || a === 11)) state.vol = b / 127;
  else if (kind === 0x90 && b > 0) { state.pos = clamp((a - 45) / (OCTAVES * 12)); state.vol = b / 127; }
  else if (kind === 0x80 || (kind === 0x90 && b === 0)) state.vol = 0;
}

// ---------- drawing ----------
const motes = [];
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize);

function orbXY() {
  // Hand mode: vertical pitch. Touch mode: horizontal pitch.
  if (state.mode === "touch") return [((state.vol - 0.25) / 0.75) * W, touchYForPos(state.pos)];
  if (state.hands.length) {
    const tip = [...state.hands].sort((a, b) => a[8].x - b[8].x)[0][8];
    return camToScreen(tip.x, tip.y);
  }
  return [W / 2, (1 - state.pos) * H];
}

function coverRect() {
  const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
  const s = Math.max(W / vw, H / vh);
  const dw = vw * s, dh = vh * s;
  return { x: (W - dw) / 2, y: (H - dh) / 2, w: dw, h: dh };
}
function camToScreen(x, y) {
  const r = coverRect();
  return [r.x + (1 - x) * r.w, r.y + y * r.h]; // mirrored
}

function drawGuides() {
  if (!state.snap) return;
  ctx.font = "700 22px system-ui, sans-serif";
  ctx.textBaseline = "middle";
  for (let o = 0; o <= OCTAVES; o++) {
    for (const d of SCALE) {
      const s = o * 12 + d;
      if (s > OCTAVES * 12) continue;
      const p = s / (OCTAVES * 12);
      const label = NAMES[s % 12];
      ctx.strokeStyle = "rgba(255,255,255,0.22)"; ctx.fillStyle = "rgba(255,255,255,0.8)";
      ctx.lineWidth = 2; ctx.beginPath();
      { const y = state.mode === "touch" ? touchYForPos(p) : camYForPos(p); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); ctx.fillText(label, 14, y - 16); }
    }
  }
}
function touchYForPos(p) { return (TOUCH_BOT - p * (TOUCH_BOT - TOUCH_TOP)) * H; }
function camYForPos(p) {
  // Inverse of the hand mapping: pos = 1 - (y - 0.1) / 0.8
  const camY = 0.1 + (1 - p) * 0.8;
  return camToScreen(0.5, camY)[1];
}

function frame() {
  trackHands();
  if (state.mode !== "midi" && performance.now() - state.lastMidi < 1500) setMode("midi");
  updateAudio();
  state.shownVol += (state.vol - state.shownVol) * 0.2;

  ctx.fillStyle = "rgba(5,6,13,0.35)";
  ctx.fillRect(0, 0, W, H);

  if (state.mode === "hand" && video.readyState >= 2) {
    const r = coverRect();
    ctx.save(); ctx.globalAlpha = 0.28;
    ctx.translate(r.x + r.w, r.y); ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, r.w, r.h);
    ctx.restore();
    for (const hand of state.hands) {
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      for (const lm of hand) { const [x, y] = camToScreen(lm.x, lm.y); ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.fill(); }
    }
  }
  drawGuides();

  const hue = 260 - state.pos * 230;
  const [ox, oy] = orbXY();
  const v = state.shownVol;
  if (v > 0.02) {
    for (let i = 0; i < 1 + v * 3; i++) {
      motes.push({ x: ox + (Math.random() - .5) * 30, y: oy + (Math.random() - .5) * 30,
        vx: (Math.random() - .5) * 1.4, vy: -0.6 - Math.random() * 1.8, life: 1, hue: hue + (Math.random() - .5) * 40, r: 3 + Math.random() * 6 * v });
    }
  }
  ctx.globalCompositeOperation = "lighter";
  for (let i = motes.length - 1; i >= 0; i--) {
    const m = motes[i];
    m.x += m.vx; m.y += m.vy; m.vy *= 0.99; m.life -= 0.012;
    if (m.life <= 0) { motes.splice(i, 1); continue; }
    ctx.fillStyle = `hsla(${m.hue},100%,65%,${m.life * 0.8})`;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r * m.life, 0, 7); ctx.fill();
  }
  const R = 18 + v * 70;
  const g = ctx.createRadialGradient(ox, oy, 0, ox, oy, R);
  g.addColorStop(0, `hsla(${hue},100%,85%,${0.25 + v * 0.75})`);
  g.addColorStop(1, `hsla(${hue},100%,55%,0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ox, oy, R, 0, 7); ctx.fill();
  ctx.globalCompositeOperation = "source-over";

  requestAnimationFrame(frame);
}

// ---------- controls ----------
function setMode(m) {
  state.mode = m; state.vol = 0; state.hands = [];
  $("bHand").classList.toggle("on", m === "hand");
  $("bTouch").classList.toggle("on", m === "touch");
  if (m === "touch") $("hint").textContent = "Slide up for higher notes. Further right is louder.";
  if (m === "midi") $("hint").textContent = "Playing from a MIDI controller.";
}
$("bHand").onclick = async () => { setMode("hand"); try { await startHand(); } catch (e) { $("hint").textContent = "Camera unavailable: " + e.message; } };
$("bTouch").onclick = () => setMode("touch");
$("bSnap").onclick = () => { state.snap = !state.snap; $("bSnap").textContent = state.snap ? "Snap to notes" : "Glide"; $("bSnap").classList.toggle("on", state.snap); };
$("bTone").onclick = () => {
  const names = Object.keys(TONES);
  state.tone = names[(names.indexOf(state.tone) + 1) % names.length];
  $("bTone").textContent = "Tone: " + state.tone;
  if (ac) setTone(state.tone);
};

$("go").onclick = async () => {
  buildAudio();
  await ac.resume();
  try { await navigator.wakeLock?.request("screen"); } catch (e) {}
  $("start").style.display = "none";
  resize(); requestAnimationFrame(frame);
  startMidi();
  setMode("hand");
  try { await startHand(); }
  catch (e) { setMode("touch"); $("hint").textContent = "No camera, so you're in Touch mode. " + $("hint").textContent; }
};

function clamp(x) { return Math.max(0, Math.min(1, x)); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
</script>
</body>
</html>
